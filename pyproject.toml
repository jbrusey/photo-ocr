[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-ocr"
version = "0.1.0"
description = "Utility scripts for OCR-ing image metadata and moving files to trash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pillow",
  "pandas",
  "pytesseract",
]

[project.scripts]
photo-ocr-extract-text = "photo_ocr.cli:extract_text_main"
photo-ocr-extract-paths = "photo_ocr.cli:extract_paths_main"
photo-ocr-extract-server-paths = "photo_ocr.cli:extract_server_paths_main"
photo-ocr-check-filenames = "photo_ocr.cli:check_filenames_main"
photo-ocr-move-to-trash = "photo_ocr.cli:move_to_trash_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
