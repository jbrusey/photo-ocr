[project]
name = "photo-ocr"
version = "0.1.0"
description = "Utility scripts for OCR-ing image metadata and moving files to trash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pillow",
  "pandas",
  "pytesseract",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
